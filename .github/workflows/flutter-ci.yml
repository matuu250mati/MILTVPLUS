name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter code
        shell: bash
        run: |
          # Keep the analyzer's real output visible: log it, add it to the run
          # summary and publish it as a single annotation. Any issue, including
          # infos, still fails the build.
          set +e
          flutter analyze 2>&1 | tee analyze.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### flutter analyze'
              echo '```'
              grep -E '^\s*(error|warning|info) ' analyze.txt | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg="$(grep -E '^\s*(error|warning|info) ' analyze.txt | head -30 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=flutter analyze::${msg}"
          fi
          exit "$status"
      - name: Run tests
        run: flutter test

  platform-build:
    name: Compile ${{ matrix.label }}
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            label: Flutter Web
            runner: ubuntu-latest
            artifact_path: build/web/**
            command: flutter build web --release --dart-define=SUPABASE_URL=https://build-only.supabase.co --dart-define=SUPABASE_ANON_KEY=build-only-placeholder

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate target platform scaffold
        shell: bash
        run: flutter create --platforms=${{ matrix.platform }} --project-name miltv_plus --org com.miltvplus .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compile target
        shell: bash
        run: ${{ matrix.command }}

      - name: Upload build output for QA
        uses: actions/upload-artifact@v7
        with:
          name: MILTVPLUS-${{ matrix.platform }}-qa
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
