name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest CI run for a branch/PR; stale commits do not need a full matrix build.
concurrency:
  group: miltvplus-flutter-ci-${{ github.ref }}
  # Keep the supported CI matrix deterministic; platform builds are not cancelled mid-run.
  cancel-in-progress: false

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Validate Supabase submission privileges
        run: bash tool/validate_supabase_migrations.sh
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate official landing page
        run: bash tool/validate_landing_page.sh
      - name: Analyze Dart and Flutter code
        run: flutter analyze
      - name: Run tests
        run: flutter test

  platform-build:
    name: Compile ${{ matrix.label }}
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            label: Flutter Web
            runner: ubuntu-24.04
            artifact_path: build/web/**
            command: flutter build web --release --dart-define=SUPABASE_URL=https://build-only.supabase.co --dart-define=SUPABASE_ANON_KEY=build-only-placeholder

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate target platform scaffold
        shell: bash
        run: flutter create --platforms=${{ matrix.platform }} --project-name miltv_plus --org com.miltvplus .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compile target
        shell: bash
        run: ${{ matrix.command }}

      - name: Upload build output for QA
        uses: actions/upload-artifact@v6
        with:
          name: MILTVPLUS-${{ matrix.platform }}-qa
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
