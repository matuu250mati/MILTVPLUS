name: Validate M3U category migration

on:
  pull_request:
    branches: ['qa/**']
    paths:
      - 'supabase/migrations/20261017120000_m3u_multicategory_keys.sql'
      - '.github/workflows/validate-m3u-category-migration.yml'
  push:
    branches: ['qa/**']
    paths:
      - 'supabase/migrations/20261017120000_m3u_multicategory_keys.sql'
      - '.github/workflows/validate-m3u-category-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa_test_only
          POSTGRES_DB: miltvplus_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miltvplus_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: qa_test_only
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: miltvplus_migration_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create minimal QA schema fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.channels (
            id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            source_key text UNIQUE,
            category text
          );
          INSERT INTO public.channels (source_key, category) VALUES
            ('m3u:espn', 'TV Argentina'),
            ('m3u:news', 'Noticias');
          SQL

      - name: Apply migration and verify category-scoped keys
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017120000_m3u_multicategory_keys.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.channels
              WHERE source_key = 'm3u:espn:category:tv-argentina'
            ) THEN
              RAISE EXCEPTION 'Expected TV Argentina source key was not generated.';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.channels
              WHERE source_key = 'm3u:news:category:noticias'
            ) THEN
              RAISE EXCEPTION 'Expected Noticias source key was not generated.';
            END IF;
          END $$;
          SQL

      - name: Verify migration aborts safely on key collision
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE public.channels;
          CREATE TABLE public.channels (
            id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            source_key text UNIQUE,
            category text
          );
          INSERT INTO public.channels (source_key, category) VALUES
            ('m3u:espn', 'TV Argentina'),
            ('m3u:espn:category:tv-argentina', 'Otra categoría');
          SQL

          if psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017120000_m3u_multicategory_keys.sql; then
            echo "ERROR: migration should have aborted because of a source_key collision."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.channels WHERE source_key = 'm3u:espn'
            ) THEN
              RAISE EXCEPTION 'Collision failure changed the original key; expected transaction rollback.';
            END IF;
          END $$;
          SQL
