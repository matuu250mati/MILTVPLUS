name: Deploy M3U sync to MILTVPLUS-QA

on:
  push:
    branches:
      - qa/deploy-m3u-sync-isolated-2026-10-18
      - qa/catalog-movie-details-favorites-2026-10-19
  workflow_dispatch:
    inputs:
      confirm_qa_project:
        description: "Type MILTVPLUS-QA to confirm the isolated target"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-qa-only:
    if: (github.ref == 'refs/heads/qa/deploy-m3u-sync-isolated-2026-10-18' || github.ref == 'refs/heads/qa/catalog-movie-details-favorites-2026-10-19') && ((github.event_name == 'workflow_dispatch' && inputs.confirm_qa_project == 'MILTVPLUS-QA') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-qa-preflight]')))
    runs-on: ubuntu-latest
    environment: miltvplus-qa
    steps:
      - name: Checkout QA deployment branch
        uses: actions/checkout@v4

      - name: Verify target and required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_QA_ACCESS_TOKEN in the miltvplus-qa environment"; exit 1; }
          test -n "$SYNC_SECRET" || { echo "::error::Missing SYNC_SECRET in the miltvplus-qa environment"; exit 1; }
          echo "Target project ref is hardcoded to the MILTVPLUS-QA project."

      - name: Install Supabase CLI
        run: npx --yes supabase@latest --version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}

      # QA retry: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are Supabase-provided runtime
      # variables. Do not attempt to set them as Edge Function secrets.
      - name: Configure only the custom sync secret for QA
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'SYNC_SECRET=%s\n' "$SYNC_SECRET" > .qa-function-secrets.env
          trap 'rm -f .qa-function-secrets.env' EXIT
          npx --yes supabase@latest secrets set --project-ref uoqfovrnlyterjylpcqj --env-file .qa-function-secrets.env

      - name: Deploy sync-m3u-catalog to QA only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy sync-m3u-catalog --project-ref uoqfovrnlyterjylpcqj --no-verify-jwt

      - name: Run read-only M3U source preflight
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -X POST 'https://uoqfovrnlyterjylpcqj.supabase.co/functions/v1/sync-m3u-catalog' \
            -H 'Content-Type: application/json' \
            -H "x-sync-secret: $SYNC_SECRET" \
            --data '{"dry_run":true}' \
            -o m3u-preflight.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("m3u-preflight.json").read_text())
          sources = report.get("sources", [])
          total_fetched = sum(int(s.get("fetched", 0)) for s in sources)
          total_accepted = sum(int(s.get("accepted", 0)) for s in sources)
          total_rejected = sum(int(s.get("rejected", 0)) for s in sources)
          total_duplicates = sum(int(s.get("duplicates", 0)) for s in sources)
          total_rejected_reasons = {}
          total_rejected_extensions = {}
          for source in sources:
              for reason, count in (source.get("rejectedReasons") or {}).items():
                  total_rejected_reasons[reason] = total_rejected_reasons.get(reason, 0) + int(count)
              for extension, count in (source.get("rejectedExtensions") or {}).items():
                  total_rejected_extensions[extension] = total_rejected_extensions.get(extension, 0) + int(count)
          print(f"Dry run only; database writes performed: {report.get('writePerformed')}")
          print(f"Sources: {len(sources)}; entries fetched: {total_fetched}; accepted: {total_accepted}; rejected: {total_rejected}; duplicates: {total_duplicates}")
          print(f"Aggregate rejection reasons: {json.dumps(total_rejected_reasons, sort_keys=True)}")
          print(f"Aggregate rejected extensions: {json.dumps(total_rejected_extensions, sort_keys=True)}")
          for source in sources:
              print(f"- {source.get('source')}: fetched={source.get('fetched', 0)}, accepted={source.get('accepted', 0)}, rejected={source.get('rejected', 0)}, duplicates={source.get('duplicates', 0)}, reasons={json.dumps(source.get('rejectedReasons', {}), sort_keys=True)}, extensions={json.dumps(source.get('rejectedExtensions', {}), sort_keys=True)}, sanitized_samples={json.dumps(source.get('rejectedSamples', []), sort_keys=True)}, error={source.get('error', 'none')}, warning={source.get('warning', 'none')}")
          with open(Path.home() / "m3u-preflight-summary.md", "w") as summary:
              summary.write("# QA M3U read-only preflight\n\n")
              summary.write(f"- Sources: {len(sources)}\n- Fetched entries: {total_fetched}\n- Accepted entries: {total_accepted}\n- Rejected entries: {total_rejected}\n- Duplicates: {total_duplicates}\n")
              summary.write(f"- Database writes performed: {report.get('writePerformed')}\n\n")
              summary.write("## Rejection reasons (aggregate)\n\n")
              for reason, count in sorted(total_rejected_reasons.items()):
                  summary.write(f"- `{reason}`: {count}\n")
              summary.write("\n## Rejected URL extensions (aggregate)\n\n")
              for extension, count in sorted(total_rejected_extensions.items(), key=lambda item: (-item[1], item[0])):
                  summary.write(f"- `{extension}`: {count}\n")
              summary.write("\n## Per-source results\n\n")
              for source in sources:
                  summary.write(f"- **{source.get('source')}**: fetched {source.get('fetched', 0)}, accepted {source.get('accepted', 0)}, rejected {source.get('rejected', 0)}, duplicates {source.get('duplicates', 0)}; error: {source.get('error', 'none')}; warning: {source.get('warning', 'none')}\n")
          if report.get("dryRun") is not True or report.get("writePerformed") is not False:
              raise SystemExit("Safety check failed: response did not confirm a read-only dry run.")
          if report.get("ok") is not True:
              raise SystemExit("Preflight found failed or partially rejected M3U sources. Review the uploaded report; live sync must not run yet.")
          PY

      - name: Publish preflight summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$HOME/m3u-preflight-summary.md" ]]; then
            cat "$HOME/m3u-preflight-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload read-only preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miltvplus-qa-m3u-preflight
          path: m3u-preflight.json
          if-no-files-found: warn
          retention-days: 7
