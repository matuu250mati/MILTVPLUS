name: Deploy M3U sync to MILTVPLUS-QA

on:
  workflow_dispatch:
    inputs:
      confirm_qa_project:
        description: "Type MILTVPLUS-QA to confirm the isolated target"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-qa-only:
    if: github.ref == 'refs/heads/qa/deploy-m3u-sync-isolated-2026-10-18' && inputs.confirm_qa_project == 'MILTVPLUS-QA'
    runs-on: ubuntu-latest
    environment: miltvplus-qa
    steps:
      - name: Checkout QA deployment branch
        uses: actions/checkout@v4

      - name: Verify target and required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_QA_SERVICE_ROLE_KEY }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_QA_ACCESS_TOKEN in the miltvplus-qa environment"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SUPABASE_QA_SERVICE_ROLE_KEY in the miltvplus-qa environment"; exit 1; }
          test -n "$SYNC_SECRET" || { echo "::error::Missing SYNC_SECRET in the miltvplus-qa environment"; exit 1; }
          echo "Target project ref is hardcoded to the MILTVPLUS-QA project."

      - name: Install Supabase CLI
        run: npx --yes supabase@latest --version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}

      - name: Configure Edge Function secrets for QA only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_QA_SERVICE_ROLE_KEY }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nSYNC_SECRET=%s\n' \
            'https://uoqfovrynlyterjylpqj.supabase.co' \
            "$SUPABASE_SERVICE_ROLE_KEY" "$SYNC_SECRET" > .qa-function-secrets.env
          trap 'rm -f .qa-function-secrets.env' EXIT
          npx --yes supabase@latest secrets set --project-ref uoqfovrynlyterjylpqj --env-file .qa-function-secrets.env

      - name: Deploy sync-m3u-catalog to QA only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy sync-m3u-catalog --project-ref uoqfovrynlyterjylpqj --no-verify-jwt
