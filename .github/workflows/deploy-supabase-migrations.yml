name: Deploy Supabase database migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: miltvplus-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Missing repository secret: $name. No migration was applied."
              exit 1
            fi
          done
          # Normalize an optional PostgREST suffix, but reject any other URL path.
          normalized="${SUPABASE_URL%/}"
          if [[ "$normalized" =~ ^(https://[a-z0-9-]+[.]supabase[.]co)/rest/v1$ ]]; then
            normalized="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$normalized" =~ ^https://([a-z0-9-]+)[.]supabase[.]co$ ]]; then
            echo "::error::SUPABASE_URL must be https://<project-ref>.supabase.co, optionally ending in /rest/v1. No migration was applied."
            exit 1
          fi
          SUPABASE_URL="$normalized"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          SUPABASE_PROJECT_ID="${BASH_REMATCH[1]}"
          if [[ "$SUPABASE_PROJECT_ID" != "mkdubrwdgorpobbrxdzy" ]]; then
            echo "::error::Production migration workflow is restricted to project mkdubrwdgorpobbrxdzy; refusing to touch $SUPABASE_PROJECT_ID."
            exit 1
          fi
          echo "SUPABASE_PROJECT_ID=$SUPABASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          if [[ ${#migrations[@]} -eq 0 ]]; then
            echo "::error::No SQL migrations found."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            filename="${migration##*/}"
            if [[ ! "$filename" =~ ^[0-9]{14}_[a-z0-9_]+[.]sql$ ]]; then
              echo "::error::Invalid Supabase migration filename: $filename. Expected YYYYMMDDHHMMSS_name.sql."
              exit 1
            fi
          done
          printf 'Validated %s timestamped migration files.\n' "${#migrations[@]}"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the intended Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations without applying them
        run: supabase db push --dry-run

      - name: Apply tracked migrations
        run: supabase db push

      - name: Verify migration history
        run: supabase migration list

      - name: Verify required PostgREST schema
        shell: bash
        run: |
          set -euo pipefail
          declare -A required_columns=(
            [channels]="title,url_stream,is_published,sort_order,logo"
            [movies]="title,url_stream,is_published,created_at"
            [series]="title,is_published"
            [episodes]="series_id,title,url_stream,is_published,season_number,episode_number"
            [content_submissions]="title,description,stream_url,poster_url,duration_seconds,series_title,season_number,episode_number,media_type,moderation_status,created_at"
          )
          failed=0
          for table in channels movies series episodes content_submissions; do
            query="select=${required_columns[$table]}&limit=0"
            status="$(curl --silent --show-error --max-time 12 \
              --output /tmp/supabase-schema-body.txt \
              --write-out '%{http_code}' \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$table?$query" || true)"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              detail="$(head -c 400 /tmp/supabase-schema-body.txt 2>/dev/null || true)"
              echo "::error::Post-deploy schema verification failed for $table (HTTP ${status:-no-response}): $detail"
              failed=1
            else
              echo "Verified $table required columns (HTTP $status)."
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more Supabase tables failed post-deployment verification."
            exit 1
          fi
