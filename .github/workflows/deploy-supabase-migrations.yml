name: Deploy Supabase database migrations

# Production schema changes must be reviewed and explicitly dispatched; never deploy on merge alone.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply the pending migrations after reviewing a separate dry-run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: miltvplus-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Missing repository secret: $name. No migration was applied."
              exit 1
            fi
          done
          # Normalize an optional PostgREST suffix, but reject any other URL path.
          normalized="${SUPABASE_URL%/}"
          if [[ "$normalized" =~ ^(https://[a-z0-9-]+[.]supabase[.]co)/rest/v1$ ]]; then
            normalized="${BASH_REMATCH[1]}"
          fi
          if [[ "$normalized" =~ ^https://([a-z0-9-]+)[.]supabase[.]co$ ]]; then
            SUPABASE_PROJECT_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::SUPABASE_URL must be https://<project-ref>.supabase.co, optionally ending in /rest/v1. No migration was applied."
            exit 1
          fi
          SUPABASE_URL="$normalized"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          if [[ "$SUPABASE_PROJECT_ID" != "mkdubrwdgorpobbrxdzy" ]]; then
            echo "::error::Production migration workflow is restricted to project mkdubrwdgorpobbrxdzy; refusing to touch $SUPABASE_PROJECT_ID."
            exit 1
          fi
          echo "SUPABASE_PROJECT_ID=$SUPABASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          if [[ ${#migrations[@]} -eq 0 ]]; then
            echo "::error::No SQL migrations found."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            filename="${migration##*/}"
            if [[ ! "$filename" =~ ^[0-9]{14}_[a-z0-9_]+[.]sql$ ]]; then
              echo "::error::Invalid Supabase migration filename: $filename. Expected YYYYMMDDHHMMSS_name.sql."
              exit 1
            fi
          done
          printf 'Validated %s timestamped migration files.\n' "${#migrations[@]}"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the intended Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations without applying them
        run: supabase db push --dry-run

      - name: Apply tracked migrations
        if: ${{ inputs.apply_migrations }}
        run: supabase db push

      - name: Verify migration history
        if: ${{ inputs.apply_migrations }}
        run: supabase migration list

      - name: Verify deployed database schema using pg_dump
        if: ${{ inputs.apply_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the linked database connection, not anon PostgREST SELECTs. The
          # intended RLS policy denies anon catalog reads after deployment.
          supabase db dump --linked --schema public --file /tmp/supabase-public-schema.sql --password "$SUPABASE_DB_PASSWORD"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          sql = Path('/tmp/supabase-public-schema.sql').read_text(encoding='utf-8')
          required = {
              'channels': {'title', 'url_stream', 'stream_urls', 'category', 'country_code', 'is_published', 'sort_order', 'logo'},
              'movies': {'tmdb_id', 'title', 'synopsis', 'category', 'genres', 'logo', 'backdrop_url', 'url_stream', 'stream_urls', 'release_year', 'duration_seconds', 'country_code', 'is_published', 'created_at', 'updated_at'},
              'series': {'tmdb_id', 'title', 'synopsis', 'category', 'genres', 'logo', 'backdrop_url', 'release_year', 'country_code', 'is_published', 'created_at', 'updated_at'},
              'episodes': {'series_id', 'title', 'synopsis', 'logo', 'url_stream', 'duration_seconds', 'is_published', 'season_number', 'episode_number', 'created_at'},
              'content_submissions': {'title', 'description', 'stream_url', 'poster_url', 'duration_seconds', 'series_title', 'season_number', 'episode_number', 'media_type', 'moderation_status', 'created_at'},
          }
          errors = []
          for table, columns in required.items():
              match = re.search(rf'CREATE TABLE\s+(?:public\.)?{re.escape(table)}\s*\((.*?)\n\);', sql, re.IGNORECASE | re.DOTALL)
              if not match:
                  errors.append(f'{table}: table definition not found in remote schema dump')
                  continue
              present = set(re.findall(r'^\s*([a-z_][a-z0-9_]*)\s+', match.group(1), re.IGNORECASE | re.MULTILINE))
              missing = sorted(columns - {name.lower() for name in present})
              if missing:
                  errors.append(f'{table}: missing required columns: {", ".join(missing)}')
          if errors:
              for error in errors:
                  print(f'ERROR: {error}', file=sys.stderr)
              sys.exit(1)
          print('Remote database schema verified: all required catalog columns are present.')
          PY

      - name: Explain dry-run-only result
        if: ${{ !inputs.apply_migrations }}
        shell: bash
        run: |
          echo "### Dry run only — no production migrations applied" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the planned migration list and the remote migration history. If any old migrations are unexpectedly pending, stop and reconcile history before a separate run with apply_migrations enabled." >> "$GITHUB_STEP_SUMMARY"
