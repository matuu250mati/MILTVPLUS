name: Sync TMDB catalog metadata

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "TMDB pages to import per type (1-5)"
        required: false
        default: "2"
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_SECRET: ${{ secrets.MILTVPLUS_CATALOG_SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_ANON_KEY SYNC_SECRET; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Catalog sync cannot run: required secret $name is missing. No metadata was imported."
              exit 1
            fi
          done
          normalized="${SUPABASE_URL%/}"
          if [[ ! "$normalized" =~ ^https://([a-z0-9-]+)[.]supabase[.]co$ ]]; then
            echo "::error::SUPABASE_URL must be https://<project-ref>.supabase.co. No metadata was imported."
            exit 1
          fi
          project_ref="${BASH_REMATCH[1]}"
          if [[ "$project_ref" != "mkdubrwdgorpobbrxdzy" ]]; then
            echo "::error::Catalog metadata sync is production-only and must target project mkdubrwdgorpobbrxdzy; got $project_ref. No metadata was imported."
            exit 1
          fi
          echo "Validated required sync secrets and production project target."

      - name: Sync movies and series metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_SECRET: ${{ secrets.MILTVPLUS_CATALOG_SYNC_SECRET }}
          REQUESTED_PAGES: ${{ inputs.pages || '2' }}
        run: |
          pages="$REQUESTED_PAGES"
          case "$pages" in
            1|2|3|4|5) ;;
            *) echo "pages must be between 1 and 5"; exit 2 ;;
          esac
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/sync-tmdb-catalog" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --header "x-sync-secret: $SYNC_SECRET" \
            --data "{\"pages\":$pages,\"includeMovies\":true,\"includeSeries\":true}")"
          echo "$response"
          echo "$response" | grep -q '"ok":true' || { echo "Catalog sync did not report success"; exit 1; }
