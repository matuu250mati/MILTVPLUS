name: Sync TMDB catalog metadata

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sync-tmdb-catalog/**'
  workflow_dispatch:
    inputs:
      pages:
        description: "TMDB pages to import per type (1-5)"
        required: false
        default: "2"
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: miltvplus-tmdb-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    # Catalog synchronization is QA-only. Never fall back to production secrets.
    environment: miltvplus-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate configuration
        id: config
        env:
          SUPABASE_QA_URL: ${{ secrets.SUPABASE_QA_URL }}
          SUPABASE_QA_ANON_KEY: ${{ secrets.SUPABASE_QA_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          SYNC_SECRET: ${{ secrets.MILTVPLUS_QA_CATALOG_SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_QA_URL SUPABASE_QA_ANON_KEY SUPABASE_ACCESS_TOKEN MILTVPLUS_QA_CATALOG_SYNC_SECRET; do
            case "$name" in
              MILTVPLUS_QA_CATALOG_SYNC_SECRET) value="$SYNC_SECRET" ;;
              *) value="${!name}" ;;
            esac
            if [[ -z "${value//[[:space:]]/}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Catalog sync cannot run. Missing QA secrets (repository or miltvplus-qa environment): %s\n' "${missing[*]}"
            exit 1
          fi
          normalized="${SUPABASE_QA_URL%/}"
          if [[ ! "$normalized" =~ ^https://([a-z0-9-]+)[.]supabase[.]co$ ]]; then
            echo "::error::SUPABASE_QA_URL must be https://<project-ref>.supabase.co."
            exit 1
          fi
          echo "SUPABASE_PROJECT_ID=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "SUPABASE_QA_URL_NORMALIZED=$normalized" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        if: steps.config.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Align QA Edge Function sync secret
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          SYNC_SECRET: ${{ secrets.MILTVPLUS_QA_CATALOG_SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the deployed Edge Function secret identical to the GitHub Environment secret.
          # Do not print the secret to logs.
          supabase secrets set "SYNC_SECRET=$SYNC_SECRET" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy catalog sync function to configured project
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy sync-tmdb-catalog --project-ref "$SUPABASE_PROJECT_ID"

      - name: Sync movies and series metadata
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_QA_URL: ${{ secrets.SUPABASE_QA_URL }}
          SUPABASE_QA_ANON_KEY: ${{ secrets.SUPABASE_QA_ANON_KEY }}
          SYNC_SECRET: ${{ secrets.MILTVPLUS_QA_CATALOG_SYNC_SECRET }}
          REQUESTED_PAGES: ${{ inputs.pages || '2' }}
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_QA_URL="${SUPABASE_QA_URL%/}"
          pages="$REQUESTED_PAGES"
          case "$pages" in
            1|2|3|4|5) ;;
            *) echo "::error::pages must be between 1 and 5"; exit 2 ;;
          esac

          body_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 180 \
            --output "$body_file" --write-out '%{http_code}' \
            --request POST "$SUPABASE_QA_URL/functions/v1/sync-tmdb-catalog" \
            --header "apikey: $SUPABASE_QA_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_QA_ANON_KEY" \
            --header "Content-Type: application/json" \
            --header "x-sync-secret: $SYNC_SECRET" \
            --data "{\"pages\":$pages,\"includeMovies\":true,\"includeSeries\":true}")" || {
              echo "::error::Could not reach Supabase Edge Function endpoint."
              cat "$body_file"
              exit 1
            }
          cat "$body_file"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            if [[ "$status" == "404" ]]; then
              echo "::error::Supabase returned 404 after deployment. Confirm SUPABASE_QA_URL points to the intended project and the function deployment succeeded."
            elif [[ "$status" == "401" ]]; then
              echo "::error::The function itself returned HTTP 401: its SYNC_SECRET is missing or does not exactly match MILTVPLUS_QA_CATALOG_SYNC_SECRET in GitHub Environment miltvplus-qa. Set the same value in Supabase QA > Edge Functions > Secrets; do not rotate or print it in logs."
            elif [[ "$status" == "500" ]]; then
              echo "::error::The Edge Function is deployed but missing required runtime secrets. Configure TMDB_API_KEY, SYNC_SECRET, and the server-side Supabase service-role key in Supabase Edge Function secrets."
            else
              echo "::error::Catalog sync endpoint returned HTTP $status."
            fi
            exit 1
          fi
          grep -q '"ok":true' "$body_file" || {
            echo "::error::Catalog sync endpoint returned success HTTP status without an ok=true result."
            exit 1
          }
          echo "Catalog metadata synchronization completed successfully."
