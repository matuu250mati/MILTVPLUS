name: Sync TMDB catalog metadata

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "TMDB pages to import per type (1-5)"
        required: false
        default: "2"
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_SECRET: ${{ secrets.MILTVPLUS_CATALOG_SYNC_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SYNC_SECRET" ]; then
            echo "::warning::Catalog sync skipped. Configure SUPABASE_URL, SUPABASE_ANON_KEY, and MILTVPLUS_CATALOG_SYNC_SECRET repository secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Sync movies and series metadata
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_SECRET: ${{ secrets.MILTVPLUS_CATALOG_SYNC_SECRET }}
          REQUESTED_PAGES: ${{ inputs.pages || '2' }}
        run: |
          pages="$REQUESTED_PAGES"
          case "$pages" in
            1|2|3|4|5) ;;
            *) echo "pages must be between 1 and 5"; exit 2 ;;
          esac
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/sync-tmdb-catalog" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --header "x-sync-secret: $SYNC_SECRET" \
            --data "{\"pages\":$pages,\"includeMovies\":true,\"includeSeries\":true}")"
          echo "$response"
          echo "$response" | grep -q '"ok":true' || { echo "Catalog sync did not report success"; exit 1; }
