name: Build MILTVPLUS Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miltvplus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_android.sh

      - name: Validate Android TV manifest and security settings
        run: bash tool/validate_android_tv.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the SUPABASE_URL repository secret."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY//[[:space:]]/}" ]]; then
            echo "::error::Configure SUPABASE_ANON_KEY with the project's publishable/anon key."
            exit 1
          fi
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | xargs)"
          while [[ "$SUPABASE_URL" == */ ]]; do
            SUPABASE_URL="${SUPABASE_URL%/}"
          done
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+[.]supabase[.]co$ ]]; then
            echo "::error::SUPABASE_URL must be exactly https://<project-ref>.supabase.co. Remove /rest/v1, paths, query strings, fragments, or dashboard URLs."
            exit 1
          fi
          if [[ "$SUPABASE_ANON_KEY" =~ [[:space:]] ]]; then
            echo "::error::SUPABASE_ANON_KEY contains whitespace. Copy the complete publishable/anon key."
            exit 1
          fi
          echo "SUPABASE_URL_NORMALIZED=$SUPABASE_URL" >> "$GITHUB_ENV"

      - name: Configure production APK signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "\${ANDROID_KEYSTORE_BASE64//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          [[ -n "\${ANDROID_KEYSTORE_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret."; exit 1; }
          [[ -n "\${ANDROID_KEY_ALIAS//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEY_ALIAS secret."; exit 1; }
          [[ -n "\${ANDROID_KEY_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEY_PASSWORD secret."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\\nstorePassword=%s\\nkeyAlias=%s\\nkeyPassword=%s\\n' \\
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
          keytool -list -keystore android/upload-keystore.jks \\
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          if [[ -z "$app_version" || "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Release tag must match pubspec.yaml version (expected v$app_version)."
            exit 1
          fi

      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL_NORMALIZED" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Name APK and generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="build-${GITHUB_SHA::7}"
          fi
          apk="build/MILTVPLUS-${version}-android.apk"
          latest_apk="build/MILTVPLUS-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp "$apk" "$latest_apk"
          (cd build && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          (cd build && sha256sum "$(basename "$latest_apk")" > "$(basename "$latest_apk").sha256")
          echo "MILTVPLUS_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_CHECKSUM_PATH=$apk.sha256" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_APK_PATH=$latest_apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_CHECKSUM_PATH=$latest_apk.sha256" >> "$GITHUB_ENV"

      - name: Upload release APK and checksum as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MILTVPLUS-release-apk
          path: |
            build/MILTVPLUS-*-android.apk
            build/MILTVPLUS-*-android.apk.sha256
            build/MILTVPLUS-android.apk
            build/MILTVPLUS-android.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$MILTVPLUS_APK_PATH" \
            "$MILTVPLUS_CHECKSUM_PATH" \
            "$MILTVPLUS_LATEST_APK_PATH" \
            "$MILTVPLUS_LATEST_CHECKSUM_PATH" \
            --verify-tag \
            --title "MILTVPLUS $GITHUB_REF_NAME" \
            --generate-notes
