name: Build MILTVPLUS Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miltvplus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_android.sh

      - name: Validate Android TV manifest and security settings
        run: bash tool/validate_android_tv.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the SUPABASE_URL repository secret."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY//[[:space:]]/}" ]]; then
            echo "::error::Configure SUPABASE_ANON_KEY with the project's publishable/anon key."
            exit 1
          fi
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | xargs)"
          while [[ "$SUPABASE_URL" == */ ]]; do
            SUPABASE_URL="${SUPABASE_URL%/}"
          done
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+[.]supabase[.]co$ ]]; then
            echo "::error::SUPABASE_URL must be exactly https://<project-ref>.supabase.co. Remove /rest/v1, paths, query strings, fragments, or dashboard URLs."
            exit 1
          fi
          if [[ "$SUPABASE_ANON_KEY" =~ [[:space:]] ]]; then
            echo "::error::SUPABASE_ANON_KEY contains whitespace. Copy the complete publishable/anon key."
            exit 1
          fi
          echo "SUPABASE_URL_NORMALIZED=$SUPABASE_URL" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL_NORMALIZED" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Name APK and generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="build-${GITHUB_SHA::7}"
          fi
          apk="build/MILTVPLUS-${version}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "MILTVPLUS_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_CHECKSUM_PATH=$apk.sha256" >> "$GITHUB_ENV"

      - name: Upload release APK and checksum as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MILTVPLUS-release-apk
          path: |
            ${{ env.MILTVPLUS_APK_PATH }}
            ${{ env.MILTVPLUS_CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$MILTVPLUS_APK_PATH" \
            "$MILTVPLUS_CHECKSUM_PATH" \
            --verify-tag \
            --title "MILTVPLUS $GITHUB_REF_NAME" \
            --generate-notes
