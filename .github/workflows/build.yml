name: Build MILTVPLUS Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_production_signing:
        description: "Firmar y verificar el APK con la clave de producción, sin publicar una Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: miltvplus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Use environment-level secrets for the matching Supabase project.
    environment:
      name: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing)) && 'production' || 'miltvplus-qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_android.sh

      - name: Add OTA installation permissions to Android manifest
        run: bash tool/patch_ota_manifest.sh

      # Every PR build uses a separate package so QA installation cannot replace production MILTVPLUS.
      - name: Prepare side-by-side QA package
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="android/app/build.gradle.kts"
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus"' "$gradle_file" || {
            echo "::error::Expected generated MILTVPLUS applicationId was not found; refusing to change package identity blindly."
            exit 1
          }
          sed -i 's/applicationId = "com.miltvplus.miltv_plus"/applicationId = "com.miltvplus.miltv_plus.qa"/' "$gradle_file"
          sed -i 's/android:label="MILTVPLUS"/android:label="MILTVPLUS QA"/' "$manifest"
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus.qa"' "$gradle_file"
          echo "Feature build uses com.miltvplus.miltv_plus.qa and can coexist with the installed MILTVPLUS app."

      - name: Validate Android TV manifest and security settings
        run: bash tool/validate_android_tv.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate Supabase configuration
        id: supabase
        env:
          # Project URLs are public identifiers and are selected explicitly below.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_QA_ANON_KEY: ${{ secrets.SUPABASE_QA_ANON_KEY }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_ANON_KEY }}
          IS_PRODUCTION_BUILD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing) }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_PRODUCTION_BUILD" == "true" ]]; then
            SUPABASE_URL="https://mkdubrwdgorpobbrxdzy.supabase.co"
            SUPABASE_ANON_KEY="${SUPABASE_PRODUCTION_ANON_KEY:-${SUPABASE_ANON_KEY:-}}"
            expected_project_ref="mkdubrwdgorpobbrxdzy"
            target_environment="production"
          else
            SUPABASE_URL="https://uoqfovrynlyterjylpqj.supabase.co"
            SUPABASE_ANON_KEY="${SUPABASE_QA_ANON_KEY:-${SUPABASE_ANON_KEY:-}}"
            expected_project_ref="uoqfovrynlyterjylpqj"
            target_environment="QA"
          fi
          SUPABASE_URL="$(printf '%s' "${SUPABASE_URL:-}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          SUPABASE_ANON_KEY="$(printf '%s' "${SUPABASE_ANON_KEY:-}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          while [[ "$SUPABASE_URL" == */ ]]; do SUPABASE_URL="${SUPABASE_URL%/}"; done
          if [[ "$SUPABASE_URL" =~ ^(https://[a-z0-9-]+[.]supabase[.]co)/rest/v1$ ]]; then
            SUPABASE_URL="${BASH_REMATCH[1]}"
          fi

          url_valid=false
          key_valid=false
          url_project_ref=""
          key_project_ref=""
          key_role=""
          if [[ "$SUPABASE_URL" =~ ^https://([a-z0-9-]+)[.]supabase[.]co$ ]]; then
            url_valid=true
            url_project_ref="${BASH_REMATCH[1]}"
          fi

          if [[ -n "$SUPABASE_ANON_KEY" && ! "$SUPABASE_ANON_KEY" =~ [[:space:]] ]]; then
            if [[ "$SUPABASE_ANON_KEY" == *.*.* ]]; then
              jwt_claims="$(python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4); d=json.loads(base64.urlsafe_b64decode(p)); print(d.get("ref","")+"|"+d.get("role",""))' "$SUPABASE_ANON_KEY" 2>/dev/null || true)"
              IFS='|' read -r key_project_ref key_role <<< "$jwt_claims"
              if [[ -n "$key_project_ref" && "$key_role" == "anon" ]]; then key_valid=true; fi
            elif [[ "$SUPABASE_ANON_KEY" == sb_publishable_* ]]; then
              key_valid=true
            fi
          fi

          echo "url_format_valid=$url_valid" >> "$GITHUB_OUTPUT"
          echo "key_format_valid=$key_valid" >> "$GITHUB_OUTPUT"

          if [[ "$url_valid" == true && "$key_valid" == true && "$url_project_ref" == "$expected_project_ref" && ( -z "$key_project_ref" || "$key_project_ref" == "$url_project_ref" ) ]]; then
            echo "SUPABASE_URL_NORMALIZED=$SUPABASE_URL" >> "$GITHUB_ENV"
            echo "SUPABASE_ANON_KEY_NORMALIZED=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Supabase URL/key format validated."
          elif [[ "$IS_FORK_PR" == true && -z "$SUPABASE_URL" && -z "$SUPABASE_ANON_KEY" ]]; then
            echo "SUPABASE_URL_NORMALIZED=" >> "$GITHUB_ENV"
            echo "SUPABASE_ANON_KEY_NORMALIZED=" >> "$GITHUB_ENV"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fork pull request has no secrets; building offline QA only. Backend validation is intentionally unavailable."
            {
              echo "### Supabase configuration: offline QA only"
              echo "This is a fork pull request with no secrets. Backend-dependent features have not been validated."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ "$url_valid" == true && "$key_valid" == true && "$url_project_ref" != "$expected_project_ref" ]]; then
              echo "::error::This $target_environment build must use Supabase project $expected_project_ref; the configured URL points to another project."
            elif [[ "$url_valid" == true && "$key_valid" == true && -n "$key_project_ref" && "$key_project_ref" != "$url_project_ref" ]]; then
              echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY refer to different Supabase projects."
            elif [[ "$url_valid" != true ]]; then
              echo "::error::SUPABASE_URL is missing or malformed. Expected https://<project-ref>.supabase.co; /rest/v1 is normalized automatically."
            elif [[ "$key_valid" != true ]]; then
              echo "::error::SUPABASE_ANON_KEY is missing, unsupported, or not a public anon/publishable key. Privileged service_role keys are rejected."
            else
              echo "::error::Supabase configuration is invalid. Refusing to build with an unverified backend."
            fi
            exit 1
          fi

      # Supabase's Management API SQL endpoint is read-only for DDL.
      # Use the official CLI and the QA database password to apply tracked migrations.
      # This step is strictly scoped to the QA project and never targets production.
      - name: Apply tracked Supabase migrations to QA
        if: ${{ github.event_name == 'pull_request' && steps.supabase.outputs.configured == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_QA_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN//[[:space:]]/}" ]] || {
            echo "::error::Missing SUPABASE_QA_ACCESS_TOKEN in the miltvplus-qa GitHub environment."
            exit 1
          }
          [[ -n "${SUPABASE_DB_PASSWORD//[[:space:]]/}" ]] || {
            echo "::error::Missing SUPABASE_QA_DB_PASSWORD in the miltvplus-qa GitHub environment. Add the QA database password as an environment secret; do not paste it into chat."
            exit 1
          }
          npx --yes supabase@latest --version
          npx --yes supabase@latest link --project-ref uoqfovrynlyterjylpqj
          echo "Checking pending QA migrations before applying them..."
          npx --yes supabase@latest db push --dry-run
          echo "Applying tracked migrations to QA only..."
          npx --yes supabase@latest db push
          echo "Confirming applied migration history..."
          npx --yes supabase@latest migration list
          echo "### QA Supabase migrations: applied and history checked" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required Supabase schema
        if: steps.supabase.outputs.configured == 'true'
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY_NORMALIZED"
          # Ask PostgREST to resolve required columns with limit=0. This validates
          # the schema even when a catalog table has no publicly visible rows.
          declare -A required_columns=(
            [channels]="title,url_stream,stream_urls,category,country_code,is_published,sort_order,logo"
            [movies]="tmdb_id,title,synopsis,category,genres,logo,backdrop_url,url_stream,stream_urls,release_year,duration_seconds,country_code,is_published,created_at,updated_at"
            [series]="tmdb_id,title,synopsis,category,genres,logo,backdrop_url,release_year,country_code,is_published,created_at,updated_at"
            [episodes]="series_id,title,synopsis,logo,url_stream,duration_seconds,is_published,season_number,episode_number,created_at"
            [content_submissions]="title,description,stream_url,poster_url,duration_seconds,series_title,season_number,episode_number,media_type,moderation_status,created_at"
          )
          failed=0
          for table in channels movies series episodes content_submissions; do
            query="select=${required_columns[$table]}&limit=0"
            status="$(curl --silent --show-error --max-time 12 \
              --output /tmp/supabase-smoke-body.txt \
              --write-out '%{http_code}' \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL_NORMALIZED/rest/v1/$table?$query" || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Supabase schema check passed: $table (HTTP $status; required columns resolved)"
            else
              detail="$(head -c 400 /tmp/supabase-smoke-body.txt 2>/dev/null || true)"
              echo "::warning::Supabase schema check failed for '$table' (HTTP ${status:-no-response}). This table-backed feature is not verified; the build will fail until the API and schema check passes. $detail"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Supabase schema/API-key validation failed. Refusing to mark this build successful while required tables or columns are inaccessible."
            exit 1
          else
            echo "### Supabase schema validation: passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure production APK signing
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_BASE64//[[:space:]]/}" ]] || { echo "::error::Missing KEYSTORE_BASE64 secret."; exit 1; }
          [[ -n "${KEYSTORE_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing KEYSTORE_PASSWORD secret."; exit 1; }
          [[ -n "${KEY_ALIAS//[[:space:]]/}" ]] || { echo "::error::Missing KEY_ALIAS secret."; exit 1; }
          [[ -n "${KEY_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing KEY_PASSWORD secret."; exit 1; }
          # Normalize whitespace introduced by mobile copy/paste before decoding.
          normalized_base64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [[ ! "$normalized_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::KEYSTORE_BASE64 contains characters that are not valid Base64. Re-encode the original .jks file and replace this repository secret."
            exit 1
          fi
          if ! printf '%s' "$normalized_base64" | base64 --decode > android/upload-keystore.jks; then
            echo "::error::KEYSTORE_BASE64 could not be decoded. The secret is truncated or malformed; replace it with a fresh Base64 encoding of the original .jks file."
            exit 1
          fi
          if [[ ! -s android/upload-keystore.jks ]]; then
            echo "::error::Decoded keystore is empty. Check KEYSTORE_BASE64."
            exit 1
          fi
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          # Check store password/type independently so failures identify the actual cause.
          if ! keytool -list -keystore android/upload-keystore.jks -storetype JKS -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore decoded, but keytool could not open it as JKS with KEYSTORE_PASSWORD. The file may be corrupt or the store password is incorrect."
            exit 1
          fi
          # Validate alias separately; do not print secrets or key material.
          if ! keytool -list -keystore android/upload-keystore.jks -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore and store password are valid, but KEY_ALIAS was not found or could not be accessed."
            exit 1
          fi
          if ! keytool_output="$(keytool -list -v -keystore android/upload-keystore.jks -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null)"; then
            echo "::error::The configured key alias exists, but keytool could not inspect its certificate. Check the keystore and key credentials."
            exit 1
          fi
          expected_cert_sha256="$(printf '%s\n' "$keytool_output" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_cert_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Keystore and alias opened, but keytool did not return a valid SHA-256 certificate fingerprint."; exit 1; }
          echo "Production keystore decoded and store password/alias validated."
          echo "MILTVPLUS_EXPECTED_SIGNER_SHA256=$expected_cert_sha256" >> "$GITHUB_ENV"

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          if [[ -z "$app_version" || "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Release tag must match pubspec.yaml version (expected v$app_version)."
            exit 1
          fi

      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY_NORMALIZED:-}"
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL_NORMALIZED" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Verify release APK signature
        env:
          VERIFY_PRODUCTION_SIGNING: ${{ inputs.verify_production_signing || false }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main || "${VERIFY_PRODUCTION_SIGNING:-false}" == "true" ]]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            [[ -n "$sdk_root" ]] || { echo "::error::Android SDK path is unavailable; cannot verify the production APK signature."; exit 1; }
            apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
            [[ -x "$apksigner" ]] || { echo "::error::apksigner was not found; cannot verify the production APK signature."; exit 1; }
            verification_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)" || {
              printf '%s\n' "$verification_output"
              echo "::error::The release APK signature is invalid."
              exit 1
            }
            printf '%s\n' "$verification_output"
            # Parse SHA-256 without relying on exact signer numbering, capitalization,
            # colon formatting, or whitespace used by different build-tools versions.
            actual_cert_sha256="$(printf '%s\n' "$verification_output" | awk '
              tolower($0) ~ /certificate sha-256 digest:/ {
                line = tolower($0)
                sub(/^.*certificate sha-256 digest:[[:space:]]*/, "", line)
                gsub(/[^0-9a-f]/, "", line)
                print line
                exit
              }
            ')"
            if [[ ! "$actual_cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::apksigner verified the APK but did not emit a parseable SHA-256 certificate fingerprint."
              echo "::error::Refusing to skip the production-certificate match check."
              exit 1
            fi
            [[ "$actual_cert_sha256" == "$MILTVPLUS_EXPECTED_SIGNER_SHA256" ]] || {
              echo "::error::The APK signer certificate does not match the configured production keystore."
              exit 1
            }
            echo "Production APK signature is valid and matches the configured keystore certificate."
          else
            echo "Non-versioned CI build: production signing verification was not requested."
          fi

      - name: Name APK and generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="build-${GITHUB_SHA::7}"
          fi
          apk="build/MILTVPLUS-${version}-android.apk"
          latest_apk="build/MILTVPLUS.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp "$apk" "$latest_apk"
          (cd build && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          (cd build && sha256sum "$(basename "$latest_apk")" > "$(basename "$latest_apk").sha256")
          echo "MILTVPLUS_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_CHECKSUM_PATH=$apk.sha256" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_APK_PATH=$latest_apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_CHECKSUM_PATH=$latest_apk.sha256" >> "$GITHUB_ENV"
          cp "$apk" build/app-release.apk
          (cd build && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Explain why no production APK artifact is uploaded
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        shell: bash
        run: |
          echo "No production APK artifact uploaded: run the workflow manually with verify_production_signing enabled, or build a version tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA APK and checksum
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: MILTVPLUS-qa-apk
          path: |
            build/MILTVPLUS-*-android.apk
            build/MILTVPLUS-*-android.apk.sha256
            build/MILTVPLUS.apk
            build/MILTVPLUS.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified production APK and checksum as workflow artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v6
        with:
          name: MILTVPLUS-release-apk
          path: |
            build/MILTVPLUS-*-android.apk
            build/MILTVPLUS-*-android.apk.sha256
            build/MILTVPLUS.apk
            build/MILTVPLUS.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Prepare OTA release metadata
        id: release_metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          [[ -n "$app_version" ]] || { echo "::error::Could not read app version from pubspec.yaml."; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == "v$app_version" ]] || { echo "::error::Tag $tag does not match pubspec.yaml version v$app_version."; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            tag="v$app_version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "OTA release $tag already exists; refusing to overwrite an already published release from an ordinary main-branch build."
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "OTA release $tag will be published from this verified main-branch build."
            fi
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish signed APK to GitHub Releases for OTA
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.release_metadata.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/MILTVPLUS.apk
            build/MILTVPLUS.apk.sha256
            build/app-release.apk
            build/app-release.apk.sha256
