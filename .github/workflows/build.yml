name: Build MILTVPLUS Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_production_signing:
        description: "Firmar y verificar el APK con la clave de producción, sin publicar una Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: miltvplus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_android.sh

      # Feature-branch APKs use a separate Android package so device testing
      # never asks the owner to uninstall or overwrite the existing installation.
      - name: Prepare side-by-side QA package
        if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'feature/adult-fullscreen-browser') || github.ref == 'refs/heads/feature/adult-fullscreen-browser' }}
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="android/app/build.gradle.kts"
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus"' "$gradle_file" || {
            echo "::error::Expected generated MILTVPLUS applicationId was not found; refusing to change package identity blindly."
            exit 1
          }
          sed -i 's/applicationId = "com.miltvplus.miltv_plus"/applicationId = "com.miltvplus.miltv_plus.qa"/' "$gradle_file"
          sed -i 's/android:label="MILTVPLUS"/android:label="MILTVPLUS QA"/' "$manifest"
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus.qa"' "$gradle_file"
          echo "Feature build uses com.miltvplus.miltv_plus.qa and can coexist with the installed MILTVPLUS app."

      - name: Validate Android TV manifest and security settings
        run: bash tool/validate_android_tv.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the SUPABASE_URL repository secret."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY//[[:space:]]/}" ]]; then
            echo "::error::Configure SUPABASE_ANON_KEY with the project's publishable/anon key."
            exit 1
          fi
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | xargs)"
          while [[ "$SUPABASE_URL" == */ ]]; do
            SUPABASE_URL="${SUPABASE_URL%/}"
          done
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+[.]supabase[.]co$ ]]; then
            echo "::error::SUPABASE_URL must be exactly https://<project-ref>.supabase.co. Remove /rest/v1, paths, query strings, fragments, or dashboard URLs."
            exit 1
          fi
          if [[ "$SUPABASE_ANON_KEY" =~ [[:space:]] ]]; then
            echo "::error::SUPABASE_ANON_KEY contains whitespace. Copy the complete publishable/anon key."
            exit 1
          fi
          echo "SUPABASE_URL_NORMALIZED=$SUPABASE_URL" >> "$GITHUB_ENV"

      - name: Verify required Supabase schema (diagnostic; APK build continues)

        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Ask PostgREST to resolve required columns with limit=0. This validates
          # the schema even when a catalog table has no publicly visible rows.
          declare -A required_columns=(
            [channels]="title,url_stream,is_published,sort_order,logo"
            [movies]="title,url_stream,is_published,created_at"
            [series]="title,is_published"
            [episodes]="series_id,title,url_stream,is_published,season_number,episode_number"
            [content_submissions]="title,description,stream_url,poster_url,duration_seconds,series_title,season_number,episode_number,media_type,moderation_status,created_at"
          )
          failed=0
          for table in channels movies series episodes content_submissions; do
            query="select=${required_columns[$table]}&limit=0"
            status="$(curl --silent --show-error --max-time 12 \
              --output /tmp/supabase-smoke-body.txt \
              --write-out '%{http_code}' \
              --header "apikey: $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL_NORMALIZED/rest/v1/$table?$query" || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Supabase schema check passed: $table (HTTP $status; required columns resolved)"
            else
              detail="$(head -c 400 /tmp/supabase-smoke-body.txt 2>/dev/null || true)"
              echo "::warning::Supabase schema check failed for '$table' (HTTP ${status:-no-response}). The APK can be built, but this table-backed feature may not work until the migration is deployed. $detail"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            {
              echo "### Supabase schema validation: warnings"
              echo "One or more tables do not yet match the app schema. The APK will still be built for installation/testing; affected database features may fail until migrations are deployed."
              echo "See `supabase/SETUP_ES.md` and the job log for table-level details."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Supabase schema validation: passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure production APK signing
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ANDROID_KEYSTORE_BASE64//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          [[ -n "${ANDROID_KEYSTORE_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret."; exit 1; }
          [[ -n "${ANDROID_KEY_ALIAS//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEY_ALIAS secret."; exit 1; }
          [[ -n "${ANDROID_KEY_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing ANDROID_KEY_PASSWORD secret."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
          keytool -list -keystore android/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          expected_cert_sha256="$(keytool -list -v -keystore android/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_cert_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Could not determine the production signing certificate SHA-256 fingerprint."; exit 1; }
          echo "MILTVPLUS_EXPECTED_SIGNER_SHA256=$expected_cert_sha256" >> "$GITHUB_ENV"

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          if [[ -z "$app_version" || "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Release tag must match pubspec.yaml version (expected v$app_version)."
            exit 1
          fi

      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL_NORMALIZED" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Verify release APK signature
        env:
          VERIFY_PRODUCTION_SIGNING: ${{ inputs.verify_production_signing || false }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          if [[ "$GITHUB_REF" == refs/tags/v* || "${VERIFY_PRODUCTION_SIGNING:-false}" == "true" ]]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            [[ -n "$sdk_root" ]] || { echo "::error::Android SDK path is unavailable; cannot verify the production APK signature."; exit 1; }
            apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
            [[ -x "$apksigner" ]] || { echo "::error::apksigner was not found; cannot verify the production APK signature."; exit 1; }
            verification_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)" || {
              printf '%s\n' "$verification_output"
              echo "::error::The release APK signature is invalid."
              exit 1
            }
            printf '%s\n' "$verification_output"
            actual_cert_sha256="$(printf '%s\\n' "$verification_output" | awk '
              tolower($0) ~ /certificate sha-256 digest:/ {
                line = tolower($0)
                sub(/^.*certificate sha-256 digest:[[:space:]]*/, "", line)
                gsub(/[^0-9a-f]/, "", line)
                print line
                exit
              }
            ')"
            [[ "$actual_cert_sha256" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::Could not read a valid 64-character APK signer certificate SHA-256 fingerprint."
              exit 1
            }
            [[ "$actual_cert_sha256" == "$MILTVPLUS_EXPECTED_SIGNER_SHA256" ]] || {
              echo "::error::The APK signer certificate does not match the configured production keystore."
              exit 1
            }
            echo "Production APK signature is valid and matches the configured keystore certificate."
          else
            echo "Non-versioned CI build: production signing verification was not requested."
          fi

      - name: Name APK and generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="build-${GITHUB_SHA::7}"
          fi
          apk="build/MILTVPLUS-${version}-android.apk"
          latest_apk="build/MILTVPLUS-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp "$apk" "$latest_apk"
          (cd build && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          (cd build && sha256sum "$(basename "$latest_apk")" > "$(basename "$latest_apk").sha256")
          echo "MILTVPLUS_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_CHECKSUM_PATH=$apk.sha256" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_APK_PATH=$latest_apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_CHECKSUM_PATH=$latest_apk.sha256" >> "$GITHUB_ENV"

      - name: Explain why the APK artifact is withheld
        if: github.event.repository.private != true
        shell: bash
        run: |
          echo "APK artifact withheld: the repository is public. Make the repository private before storing downloadable build artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private APK and checksum as workflow artifacts
        if: github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: MILTVPLUS-${{ ((github.event_name == 'pull_request' && github.head_ref == 'feature/adult-fullscreen-browser') || startsWith(github.ref, 'refs/heads/feature/')) && 'qa' || 'release' }}-apk
          path: |
            build/MILTVPLUS-*-android.apk
            build/MILTVPLUS-*-android.apk.sha256
            build/MILTVPLUS-android.apk
            build/MILTVPLUS-android.apk.sha256
          if-no-files-found: error
          retention-days: 14

      # Publicación pública desactivada intencionalmente. La distribución requerirá
      # autorización expresa del propietario y un procedimiento separado.
