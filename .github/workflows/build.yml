name: Build MILTVPLUS Android APK

on:
  push:
    branches: [main, 'qa/**', 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main, 'qa/**']
  workflow_dispatch:
    inputs:
      verify_production_signing:
        description: "Firmar y verificar el APK con la clave de producción, sin publicar una Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: miltvplus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_android.sh

      - name: Add OTA installation permissions to Android manifest
        run: bash tool/patch_ota_manifest.sh

      # Every PR build uses a separate package so QA installation cannot replace production MILTVPLUS.
      - name: Prepare side-by-side QA package
        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/qa/') || startsWith(github.ref, 'refs/heads/feat/') }}
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="android/app/build.gradle.kts"
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus"' "$gradle_file" || {
            echo "::error::Expected generated MILTVPLUS applicationId was not found; refusing to change package identity blindly."
            exit 1
          }
          sed -i 's/applicationId = "com.miltvplus.miltv_plus"/applicationId = "com.miltvplus.miltv_plus.qa"/' "$gradle_file"
          sed -i 's/android:label="MILTVPLUS"/android:label="MILTVPLUS QA"/' "$manifest"
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus.qa"' "$gradle_file"
          echo "Feature build uses com.miltvplus.miltv_plus.qa and can coexist with the installed MILTVPLUS app."

      - name: Validate Android TV manifest and security settings
        run: bash tool/validate_android_tv.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Production backend preflight (read-only diagnostic)
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(printf '%s' "$SUPABASE_PRODUCTION_URL" | xargs)"
          while [[ "$url" == */ ]]; do url="${url%/}"; done
          if [[ -z "$url" || -z "${SUPABASE_PRODUCTION_ANON_KEY//[[:space:]]/}" || ! "$url" =~ ^https://[a-z0-9]{20}[.]supabase[.]co$ ]]; then
            echo "::warning::Production backend preflight skipped: production URL/key configuration is missing or malformed."
            exit 0
          fi
          declare -A required_columns=(
            [channels]="title,url_stream,is_published,sort_order,logo"
            [movies]="title,url_stream,is_published,created_at"
            [series]="title,is_published"
            [episodes]="series_id,title,url_stream,is_published,season_number,episode_number"
            [content_submissions]="title,description,stream_url,poster_url,duration_seconds,series_title,season_number,episode_number,media_type,moderation_status,created_at"
          )
          failed=0
          for table in channels movies series episodes content_submissions; do
            query="select=${required_columns[$table]}&limit=0"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 5 --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              --header "apikey: $SUPABASE_PRODUCTION_ANON_KEY" \
              "$url/rest/v1/$table?$query" || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Production backend preflight passed: $table (HTTP $status)."
            else
              echo "::warning::Production backend preflight could not verify $table (HTTP ${status:-no-response}); no data was changed."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "### Production backend preflight: warnings" >> "$GITHUB_STEP_SUMMARY"
            echo "At least one production API/schema check did not return HTTP 2xx. This diagnostic is read-only; production release gates remain enforced by the release workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Production backend preflight: passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate Supabase configuration
        env:
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_QA_URL: ${{ secrets.SUPABASE_QA_URL }}
          SUPABASE_QA_ANON_KEY: ${{ secrets.SUPABASE_QA_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          QA_BACKEND_VALID=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" == refs/heads/qa/* || "$GITHUB_REF" == refs/heads/feat/* ]]; then
            SUPABASE_ANON_KEY="$SUPABASE_QA_ANON_KEY"
            # Resolve QA from the configured URL, then verify the exact project ID.
            # Do not depend on a display name: Supabase project names are user-editable.
            # Project identity is the immutable project ref, not its editable display name.
            # If a Management API token is available, fail closed unless that exact ID
            # appears in the account's accessible project list. Never print the token.
            expected_ref=""
            # Use the same tested URL guard that CI exercises independently.
            source tool/qa_supabase_guard.sh
            candidate_ref="$(qa_project_ref_from_url "$SUPABASE_QA_URL" || true)"
            if [[ -z "$candidate_ref" ]]; then
              echo "::warning::QA project URL is malformed; expected https://<20-character-project-ref>.supabase.co."
              # Diagnostic only: if the URL is bad, use the Management API (when
              # authorized) to discover whether an accessible QA/MILTVPLUS project
              # exists. Never select or publish against a discovered project automatically.
              if [[ -n "${SUPABASE_ACCESS_TOKEN//[[:space:]]/}" ]]; then
                diagnostic_projects="$(curl --fail --silent --show-error --max-time 20 \
                  --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  https://api.supabase.com/v1/projects 2>/dev/null || true)"
                if [[ -n "$diagnostic_projects" ]]; then
                  candidate_lines="$(printf '%s' "$diagnostic_projects" | python3 -c '
          import json, re, sys
          try:
              projects = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          if isinstance(projects, list):
              for project in projects:
                  if not isinstance(project, dict):
                      continue
                  name = str(project.get("name", "")).strip()
                  ref = str(project.get("id", "")).strip()
                  if re.fullmatch(r"[a-z0-9]{20}", ref):
                      safe_name = name.replace("\\n", " ").replace("\\r", " ")[:80]
                      if not safe_name:
                          safe_name = "unnamed project"
                      print(f"{safe_name} [{ref}]")
          ' 2>/dev/null || true)"
                  if [[ -n "$candidate_lines" ]]; then
                    while IFS= read -r candidate_line; do
                      [[ -n "$candidate_line" ]] && echo "::notice::Accessible Supabase candidate (diagnostic only): $candidate_line"
                    done <<< "$candidate_lines"
                  else
                    echo "::notice::Supabase Management API returned no valid project references. No project was selected."
                  fi
                else
                  echo "::warning::Could not query Supabase Management API. Check token permissions; no project was selected."
                fi
              else
                echo "::warning::SUPABASE_ACCESS_TOKEN is not configured, so CI cannot inspect the Supabase account for a project while the QA URL is malformed."
              fi
            else
              if qa_url_points_to_production "$SUPABASE_QA_URL" "$SUPABASE_PRODUCTION_URL"; then
                echo "::error::QA backend points to the production Supabase project. Refusing to build a QA package against production."
                exit 1
              fi

              if [[ -n "${SUPABASE_ACCESS_TOKEN//[[:space:]]/}" ]]; then
                projects_json="$(curl --fail --silent --show-error --max-time 20 \
                  --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  https://api.supabase.com/v1/projects 2>/dev/null || true)"
                if [[ -n "$projects_json" ]]; then
                  expected_ref="$(printf '%s' "$projects_json" | python3 -c '
          import json, re, sys
          candidate = sys.argv[1]
          try:
              projects = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          if isinstance(projects, list):
              matches = [p for p in projects if isinstance(p, dict) and str(p.get("id", "")).strip() == candidate]
              if len(matches) == 1 and re.fullmatch(r"[a-z0-9]{20}", candidate):
                  print(candidate)
          ' "$candidate_ref" 2>/dev/null || true)"
                fi
                if [[ -z "$expected_ref" ]]; then
                  echo "::warning::Configured QA project ID was not verified in the accessible Supabase project list. Check SUPABASE_ACCESS_TOKEN permissions and SUPABASE_QA_URL."
                fi
              else
                # URL and anon-key schema smoke tests below still validate connectivity.
                # A distinct, valid project ref is accepted when Management API access
                # is intentionally not configured.
                expected_ref="$candidate_ref"
              fi
            fi

            if [[ -n "$expected_ref" ]]; then
              SUPABASE_URL="https://$expected_ref.supabase.co"
              QA_BACKEND_VALID=true
              echo "Resolved isolated QA Supabase project."
            elif [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" == refs/heads/qa/* || "$GITHUB_REF" == refs/heads/feat/* ]]; then
              # Keep CI compilation/tests useful without fabricating a distributable
              # APK. The upload step is skipped until a real isolated QA project exists.
              SUPABASE_URL="https://miltvplusqa000000000.supabase.co"
              SUPABASE_ANON_KEY="ci-placeholder-key-not-for-distribution"
              QA_BACKEND_VALID=false
              echo "::warning::No accessible, valid MILTVPLUS-QA project was found. This run is compile/test-only; no QA APK will be uploaded."
              {
                echo "### QA backend: not configured"
                echo "No valid isolated QA project was resolved. Compile/tests may run, but the QA APK artifact is intentionally withheld."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Production build cannot proceed through the QA configuration path."
              exit 1
            fi
          else
            SUPABASE_URL="$SUPABASE_PRODUCTION_URL"
            SUPABASE_ANON_KEY="$SUPABASE_PRODUCTION_ANON_KEY"
            expected_ref=""
          fi
          if [[ -z "${SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the SUPABASE_URL repository secret."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY//[[:space:]]/}" ]]; then
            echo "::error::Configure SUPABASE_ANON_KEY with the project's publishable/anon key."
            exit 1
          fi
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | xargs)"
          while [[ "$SUPABASE_URL" == */ ]]; do
            SUPABASE_URL="${SUPABASE_URL%/}"
          done
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9]{20}[.]supabase[.]co$ ]]; then
            echo "::error::SUPABASE_URL must be exactly https://<project-ref>.supabase.co. Remove /rest/v1, paths, query strings, fragments, or dashboard URLs."
            exit 1
          fi

          # Never print the URL or credentials. QA must match its isolated project exactly.
          if [[ -n "$expected_ref" ]]; then
            actual_ref="${SUPABASE_URL#https://}"
            actual_ref="${actual_ref%.supabase.co}"
            if [[ "$actual_ref" != "$expected_ref" ]]; then
              echo "::error::QA build refused: Supabase project is not the approved isolated QA project."
              exit 1
            fi
            echo "Supabase destination verified for isolated QA."
          fi

          if [[ "$SUPABASE_ANON_KEY" =~ [[:space:]] ]]; then
            echo "::error::SUPABASE_ANON_KEY contains whitespace. Copy the complete publishable/anon key."
            exit 1
          fi
          echo "SUPABASE_URL_NORMALIZED=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "QA_BACKEND_VALID=$QA_BACKEND_VALID" >> "$GITHUB_ENV"

      - name: Verify Supabase DNS resolution
        if: ${{ env.QA_BACKEND_VALID != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          host="${SUPABASE_URL_NORMALIZED#https://}"
          if [[ ! "$host" =~ ^[a-z0-9]{20}[.]supabase[.]co$ ]]; then
            echo "::error::Supabase host failed the 20-character project-ref check before DNS lookup."
            exit 1
          fi
          for attempt in 1 2 3; do
            if getent ahosts "$host" >/dev/null 2>&1; then
              echo "Supabase DNS resolution passed for the configured project host."
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::DNS lookup attempt $attempt/3 failed; retrying after a short delay."
              sleep 2
            fi
          done
          echo "::error::Supabase DNS lookup failed after 3 attempts. Verify that SUPABASE_URL names the real, active project; a correctly shaped but nonexistent project ref cannot be fixed by retrying DNS."
          exit 1

      - name: Verify required Supabase schema (QA diagnostic; production is blocked on failure)
        if: ${{ env.QA_BACKEND_VALID != 'false' }}
        env:
          VERIFY_PRODUCTION_SIGNING: ${{ inputs.verify_production_signing || false }}
        shell: bash
        run: |
          set -euo pipefail
          # Ask PostgREST to resolve required columns with limit=0. This validates
          # the schema even when a catalog table has no publicly visible rows.
          declare -A required_columns=(
            [channels]="title,url_stream,is_published,sort_order,logo"
            [movies]="title,url_stream,is_published,created_at"
            [series]="title,is_published"
            [episodes]="series_id,title,url_stream,is_published,season_number,episode_number"
            [content_submissions]="title,description,stream_url,poster_url,duration_seconds,series_title,season_number,episode_number,media_type,moderation_status,created_at"
          )
          failed=0
          for table in channels movies series episodes content_submissions; do
            query="select=${required_columns[$table]}&limit=0"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 5 --max-time 20 \
              --output /tmp/supabase-smoke-body.txt \
              --write-out '%{http_code}' \
              --header "apikey: $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL_NORMALIZED/rest/v1/$table?$query" || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Supabase schema check passed: $table (HTTP $status; required columns resolved)"
            else
              detail="$(head -c 400 /tmp/supabase-smoke-body.txt 2>/dev/null || true)"
              echo "::warning::Supabase schema check failed for '$table' (HTTP ${status:-no-response}). The APK can be built, but this table-backed feature may not work until the migration is deployed. $detail"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            {
              echo "### Supabase schema validation: BLOCKED"
              echo "One or more required tables could not be reached or did not match the app schema."
              echo "Do not publish this build as a production release until every required table passes and the app's backend is reachable."
              echo 'See supabase/SETUP_ES.md and the job log for table-level details.'
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main || ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${VERIFY_PRODUCTION_SIGNING:-false}" == "true" ) ]]; then
              echo "::error::Production release blocked: required Supabase schema/network checks failed."
              exit 1
            fi
            echo "::warning::QA APK only: Supabase backend checks failed; database-backed functionality is not certified."
          else
            echo "### Supabase schema validation: passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure production APK signing
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_BASE64//[[:space:]]/}" ]] || { echo "::error::Missing KEYSTORE_BASE64 secret."; exit 1; }
          [[ -n "${KEYSTORE_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing KEYSTORE_PASSWORD secret."; exit 1; }
          [[ -n "${KEY_ALIAS//[[:space:]]/}" ]] || { echo "::error::Missing KEY_ALIAS secret."; exit 1; }
          [[ -n "${KEY_PASSWORD//[[:space:]]/}" ]] || { echo "::error::Missing KEY_PASSWORD secret."; exit 1; }
          # Normalize whitespace introduced by mobile copy/paste before decoding.
          normalized_base64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [[ ! "$normalized_base64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::KEYSTORE_BASE64 contains characters that are not valid Base64. Re-encode the original .jks file and replace this repository secret."
            exit 1
          fi
          if ! printf '%s' "$normalized_base64" | base64 --decode > android/upload-keystore.jks; then
            echo "::error::KEYSTORE_BASE64 could not be decoded. The secret is truncated or malformed; replace it with a fresh Base64 encoding of the original .jks file."
            exit 1
          fi
          if [[ ! -s android/upload-keystore.jks ]]; then
            echo "::error::Decoded keystore is empty. Check KEYSTORE_BASE64."
            exit 1
          fi
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          # Check store password/type independently so failures identify the actual cause.
          if ! keytool -list -keystore android/upload-keystore.jks -storetype JKS -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore decoded, but keytool could not open it as JKS with KEYSTORE_PASSWORD. The file may be corrupt or the store password is incorrect."
            exit 1
          fi
          # Validate alias separately; do not print secrets or key material.
          if ! keytool -list -keystore android/upload-keystore.jks -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore and store password are valid, but KEY_ALIAS was not found or could not be accessed."
            exit 1
          fi
          if ! keytool_output="$(keytool -list -v -keystore android/upload-keystore.jks -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null)"; then
            echo "::error::The configured key alias exists, but keytool could not inspect its certificate. Check the keystore and key credentials."
            exit 1
          fi
          expected_cert_sha256="$(printf '%s\n' "$keytool_output" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_cert_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Keystore and alias opened, but keytool did not return a valid SHA-256 certificate fingerprint."; exit 1; }
          echo "Production keystore decoded and store password/alias validated."
          echo "MILTVPLUS_EXPECTED_SIGNER_SHA256=$expected_cert_sha256" >> "$GITHUB_ENV"

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          if [[ -z "$app_version" || "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Release tag must match pubspec.yaml version (expected v$app_version)."
            exit 1
          fi

      - name: Build release APK
        # Pin FVP's native Android SDK to an immutable upstream release. The
        # default SourceForge nightly endpoint intermittently returns HTTP errors.
        env:
          FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/download/v0.38.0
          FVP_DEPS_SHA256: ac9ee8a4d24bb8a3d8294ff60fada7244145b8469fc1abbff8a9d45458b4de6a
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL_NORMALIZED" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Verify APK signature and production certificate
        env:
          VERIFY_PRODUCTION_SIGNING: ${{ inputs.verify_production_signing || false }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" ]] || { echo "::error::Android SDK path is unavailable; cannot verify the APK signature."; exit 1; }
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          [[ -x "$apksigner" ]] || { echo "::error::apksigner was not found; cannot verify the APK signature."; exit 1; }
          verification_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)" || {
            printf '%s\n' "$verification_output"
            echo "::error::The APK signature is invalid."
            exit 1
          }
          printf '%s\n' "$verification_output"
          echo "APK signature verified cryptographically."

          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main || "${VERIFY_PRODUCTION_SIGNING:-false}" == "true" ]]; then
            actual_cert_sha256="$(printf '%s\n' "$verification_output" | awk '
              tolower($0) ~ /certificate sha-256 digest:/ {
                line = tolower($0)
                sub(/^.*certificate sha-256 digest:[[:space:]]*/, "", line)
                gsub(/[^0-9a-f]/, "", line)
                print line
                exit
              }
            ')"
            if [[ ! "$actual_cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::apksigner verified the APK but did not emit a parseable SHA-256 certificate fingerprint."
              echo "::error::Refusing to skip the production-certificate match check."
              exit 1
            fi
            [[ "$actual_cert_sha256" == "$MILTVPLUS_EXPECTED_SIGNER_SHA256" ]] || {
              echo "::error::The APK signer certificate does not match the configured production keystore."
              exit 1
            }
            echo "Production APK signature matches the configured keystore certificate."
          else
            echo "QA APK signature is valid; this artifact is CI-signed and is not the production-signed release."
          fi

      - name: Name APK and generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="build-${GITHUB_SHA::7}"
          fi
          apk="build/MILTVPLUS-${version}-android.apk"
          latest_apk="build/MILTVPLUS.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp "$apk" "$latest_apk"
          (cd build && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          (cd build && sha256sum "$(basename "$latest_apk")" > "$(basename "$latest_apk").sha256")
          echo "MILTVPLUS_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_CHECKSUM_PATH=$apk.sha256" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_APK_PATH=$latest_apk" >> "$GITHUB_ENV"
          echo "MILTVPLUS_LATEST_CHECKSUM_PATH=$latest_apk.sha256" >> "$GITHUB_ENV"
          cp "$apk" build/app-release.apk
          (cd build && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Explain why no production APK artifact is uploaded
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        shell: bash
        run: |
          echo "No production APK artifact uploaded: run the workflow manually with verify_production_signing enabled, or build a version tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA APK and checksum
        if: ${{ env.QA_BACKEND_VALID != 'false' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/qa/') || startsWith(github.ref, 'refs/heads/feat/')) }}
        uses: actions/upload-artifact@v5
        with:
          name: MILTVPLUS-qa-apk
          path: |
            build/MILTVPLUS-*-android.apk
            build/MILTVPLUS-*-android.apk.sha256
            build/MILTVPLUS.apk
            build/MILTVPLUS.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified production APK and checksum as workflow artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_production_signing) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v5
        with:
          name: MILTVPLUS-release-apk
          path: |
            build/MILTVPLUS-*-android.apk
            build/MILTVPLUS-*-android.apk.sha256
            build/MILTVPLUS.apk
            build/MILTVPLUS.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Prepare OTA release metadata
        id: release_metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          [[ -n "$app_version" ]] || { echo "::error::Could not read app version from pubspec.yaml."; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == "v$app_version" ]] || { echo "::error::Tag $tag does not match pubspec.yaml version v$app_version."; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            tag="v$app_version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "OTA release $tag already exists; refusing to overwrite an already published release from an ordinary main-branch build."
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "OTA release $tag will be published from this verified main-branch build."
            fi
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish signed APK to GitHub Releases for OTA
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.release_metadata.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/MILTVPLUS.apk
            build/MILTVPLUS.apk.sha256
            build/app-release.apk
            build/app-release.apk.sha256
