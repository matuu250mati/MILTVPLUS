name: Build MILTVPLUS Android APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miltvplus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Supabase migration privileges
        run: bash tool/validate_supabase_migrations.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: bash tool/bootstrap_android.sh

      - name: Validate Android SDK and TV configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*36([[:space:]]*//.*)?$' android/app/build.gradle.kts
          bash tool/patch_ota_manifest.sh
          bash tool/validate_android_tv.sh

      - name: Isolate pull-request package
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=android/app/build.gradle.kts
          manifest=android/app/src/main/AndroidManifest.xml
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus"' "$gradle_file"
          sed -i 's/applicationId = "com.miltvplus.miltv_plus"/applicationId = "com.miltvplus.miltv_plus.qa"/' "$gradle_file"
          sed -i 's/android:label="MILTVPLUS"/android:label="MILTVPLUS QA"/' "$manifest"
          grep -Fq 'applicationId = "com.miltvplus.miltv_plus.qa"' "$gradle_file"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK for validation
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_QA_URL: ${{ vars.SUPABASE_QA_URL }}
          SUPABASE_QA_ANON_KEY: ${{ secrets.SUPABASE_QA_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          url="${SUPABASE_QA_URL:-${SUPABASE_URL:-}}"
          key="${SUPABASE_QA_ANON_KEY:-${SUPABASE_ANON_KEY:-}}"
          if [[ -z "$url" || -z "$key" ]]; then
            echo "::error::Missing QA Supabase URL/key. Configure SUPABASE_QA_URL and SUPABASE_QA_ANON_KEY (or SUPABASE_URL and SUPABASE_ANON_KEY) in repository/environment settings."
            exit 1
          fi
          flutter build apk --release --dart-define="SUPABASE_URL=$url" --dart-define="SUPABASE_ANON_KEY=$key"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/MILTVPLUS-qa.apk
          (cd build && sha256sum MILTVPLUS-qa.apk > MILTVPLUS-qa.apk.sha256)

      - name: Upload QA APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: MILTVPLUS-qa-apk
          path: |
            build/MILTVPLUS-qa.apk
            build/MILTVPLUS-qa.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK validation artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: MILTVPLUS-android-apk
          path: |
            build/MILTVPLUS-qa.apk
            build/MILTVPLUS-qa.apk.sha256
          if-no-files-found: error
          retention-days: 14
