# Tipos MIME para un servidor HTTP embebido (por ejemplo, NanoHTTPD).
# Este archivo es una plantilla de configuración; solo tendrá efecto si el código del servidor
# lo carga explícitamente. La app Flutter actual no queda conectada automáticamente a NanoHTTPD.
css=text/css
htm=text/html
html=text/html
xml=text/xml
java=text/x-java-source, text/java
md=text/plain
txt=text/plain
asc=text/plain
gif=image/gif
jpg=image/jpeg
jpeg=image/jpeg
png=image/png
svg=image/svg+xml
mp3=audio/mpeg
m3u=audio/mpeg-url
m3u8=application/vnd.apple.mpegurl
mp4=video/mp4
ogv=video/ogg
flv=video/x-flv
mov=video/quicktime
swf=application/x-shockwave-flash
js=application/javascript
pdf=application/pdf
doc=application/msword
ogg=application/ogg
zip=application/octet-stream
exe=application/octet-stream
class=application/octet-stream
ts=video/mp2t
